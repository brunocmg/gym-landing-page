<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/login.css" />
    <link rel="stylesheet" href="./css/responsive-login.css" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <title>Power Fit - Login do Aluno</title>
  </head>
  <body>
    <nav class="menu-home-navegacao">
      <h2>Power Fit</h2>
      <ul>
        <li><a href="index.html"> Home</a></li>
      </ul>
    </nav>

    <main class="sessao-login">
      <div class="login-container">
        <div class="login-imagem"></div>

        <div class="login-formulario-wrapper">
          <h1>Login do Aluno</h1>

          <form class="form-login" id="form-login" action="#">
            <div class="input-group">
              <label for="cpf"><i class="ph ph-user"></i> CPF</label>
              <input
                type="text"
                id="cpf"
                placeholder="000.000.000-00"
                maxlength="14"
                required
              />
            </div>

            <div class="input-group">
              <label for="senha"><i class="ph ph-lock"></i> Senha</label>
              <input type="password" id="senha" placeholder="*****" required />
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-entrar">Entrar</button>
              <span class="separador">ou</span>
              <a href="./register.html" class="btn-registrar">Registre-se</a>
            </div>
          </form>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="brand">Power Fit</div>
        <nav class="footer-links">
          <a href="#">Privacidade</a>
          <a href="#">Termos de Uso</a>
          <a href="#">Contato</a>
        </nav>
        <div class="copyright">
          © 2026 Power Fit - Elite Training. Todos os direitos reservados.
        </div>
      </div>
    </footer>

    <div id="toast-sucesso" class="toast-oculto">
      <i class="ph-fill ph-check-circle"></i>
      <span>Login bem-sucedido!</span>
    </div>

    <audio id="som-sucesso" src="./assets/songs/notification-sound.mp3"></audio>

    <script src="./js/login.js"></script>
  </body>
</html>
